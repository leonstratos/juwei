<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生成应用图标</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        canvas {
            border: 2px solid #ddd;
            margin: 20px;
            background: white;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }
        .icon-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .icon-item {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>家庭药箱管理家 - 图标生成器</h1>
    <p>点击按钮生成并下载所需的应用图标</p>
    
    <button onclick="generateAllIcons()">生成并下载所有图标</button>
    
    <div class="icon-container" id="iconContainer"></div>
    
    <script>
        function drawIcon(canvas, size, isMaskable = false) {
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // 背景渐变
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#ff758c');
            gradient.addColorStop(1, '#ff7eb3');
            ctx.fillStyle = gradient;
            
            if (isMaskable) {
                // Maskable 图标使用方形背景
                ctx.fillRect(0, 0, size, size);
            } else {
                // 普通图标使用圆角背景
                const radius = size * 0.2;
                ctx.beginPath();
                ctx.moveTo(radius, 0);
                ctx.lineTo(size - radius, 0);
                ctx.quadraticCurveTo(size, 0, size, radius);
                ctx.lineTo(size, size - radius);
                ctx.quadraticCurveTo(size, size, size - radius, size);
                ctx.lineTo(radius, size);
                ctx.quadraticCurveTo(0, size, 0, size - radius);
                ctx.lineTo(0, radius);
                ctx.quadraticCurveTo(0, 0, radius, 0);
                ctx.closePath();
                ctx.fill();
            }
            
            // 绘制十字（医疗图标）
            const centerX = size / 2;
            const centerY = size / 2;
            const strokeWidth = size * 0.08;
            const crossLength = size * 0.5;
            
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = strokeWidth;
            ctx.lineCap = 'round';
            
            // 垂直十字线
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - crossLength / 2);
            ctx.lineTo(centerX, centerY + crossLength / 2);
            ctx.stroke();
            
            // 水平十字线
            ctx.beginPath();
            ctx.moveTo(centerX - crossLength / 2, centerY);
            ctx.lineTo(centerX + crossLength / 2, centerY);
            ctx.stroke();
            
            // 圆圈
            ctx.lineWidth = strokeWidth * 0.6;
            ctx.beginPath();
            ctx.arc(centerX, centerY, crossLength * 0.45, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        function downloadIcon(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function generateAllIcons() {
            const container = document.getElementById('iconContainer');
            container.innerHTML = '';
            
            const sizes = [192, 512, 1024];
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                drawIcon(canvas, size, false);
                
                const item = document.createElement('div');
                item.className = 'icon-item';
                item.innerHTML = `
                    <canvas width="${size}" height="${size}" style="width: 100px; height: 100px;"></canvas>
                    <p>${size}x${size}</p>
                `;
                const previewCanvas = item.querySelector('canvas');
                const previewCtx = previewCanvas.getContext('2d');
                previewCtx.drawImage(canvas, 0, 0, 100, 100);
                
                container.appendChild(item);
                downloadIcon(canvas, `icon-${size}.png`);
            });
            
            // 生成 maskable 图标
            const maskableCanvas = document.createElement('canvas');
            drawIcon(maskableCanvas, 512, true);
            downloadIcon(maskableCanvas, 'maskable-icon-512.png');
            
            const maskableItem = document.createElement('div');
            maskableItem.className = 'icon-item';
            maskableItem.innerHTML = `
                <canvas width="512" height="512" style="width: 100px; height: 100px;"></canvas>
                <p>Maskable 512x512</p>
            `;
            const maskablePreviewCanvas = maskableItem.querySelector('canvas');
            const maskablePreviewCtx = maskablePreviewCanvas.getContext('2d');
            maskablePreviewCtx.drawImage(maskableCanvas, 0, 0, 100, 100);
            container.appendChild(maskableItem);
            
            alert('图标已下载！请将它们放入 /juwei/icons/ 文件夹中');
        }
    </script>
</body>
</html>
